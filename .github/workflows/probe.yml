name: API 구조 확인
on:
  push:
    paths: ['.github/workflows/probe.yml', 'scripts/probe.mjs']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: API 호출
        run: node scripts/probe.mjs || echo '{"crashed":true}' > data/probe.json
        env:
          ANIMAL_API_KEY: ${{ secrets.ANIMAL_API_KEY }}
      - name: 결과 요약
        if: always()
        run: |
          echo '## 확인 결과' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          head -c 6000 data/probe.json >> "$GITHUB_STEP_SUMMARY" || echo 'probe.json 없음' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: 저장
        continue-on-error: true
        run: |
          git config user.name "baldojang-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/probe.json
          git commit -m "API 구조 확인 결과" || echo "변경 없음"
          git pull --rebase origin main || true
          git push 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
