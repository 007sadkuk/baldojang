name: API 구조 확인
on:
  push:
    paths: ['.github/workflows/probe.yml', 'scripts/probe.mjs']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/probe.mjs || echo '{"crashed":true}' > data/probe.json
        env:
          ANIMAL_API_KEY: ${{ secrets.ANIMAL_API_KEY }}
      - run: |
          git config user.name "baldojang-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/probe.json
          git commit -m "API 구조 확인 결과" || echo "변경 없음"
          git pull --rebase origin main || true
          git push
