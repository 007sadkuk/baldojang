name: 분실동물 API 주소 확인
on:
  push:
    paths: ['.github/workflows/probe-lost.yml', 'scripts/probe-lost.mjs']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: mkdir -p data && node scripts/probe-lost.mjs > data/probe-lost.json
        env:
          ANIMAL_API_KEY: ${{ secrets.ANIMAL_API_KEY }}
      - run: |
          git config user.name "baldojang-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/probe-lost.json
          git commit -m "분실동물 API 확인 결과" || exit 0
          git pull --rebase origin main
          git push
