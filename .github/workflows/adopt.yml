name: 입양 대기 아이 목록 갱신
on:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths: ['.github/workflows/adopt.yml', 'scripts/fetch-adopt.mjs']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 목록 받기
        run: node scripts/fetch-adopt.mjs | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          ANIMAL_API_KEY: ${{ secrets.ANIMAL_API_KEY }}
      - name: 저장
        run: |
          git config user.name "baldojang-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/adopt.json
          git commit -m "입양 대기 목록 갱신" || exit 0
          git pull --rebase origin main
          git push
